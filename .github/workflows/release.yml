name: Release

# Releases the version already on the default branch. Release prep (version
# bump + islands pin) lands through a normal PR first:
#   node scripts/pin-islands.mjs
#   node scripts/version-bump.mjs <x.y.z>
# This workflow never commits or pushes to the branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read version from manifest
        run: node -p "'VERSION=' + require('./manifest.json').version" >> "$GITHUB_ENV"

      - name: Build
        run: pnpm build

      - name: Tag the release commit
        run: |
          # An annotated tag needs a committer identity, which the runner lacks.
          git config user.name "github-actions[bot]"
          git config user.email "41898604+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "$VERSION"

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$VERSION" --title "$VERSION" --draft main.js manifest.json styles.css
